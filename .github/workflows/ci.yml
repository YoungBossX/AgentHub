name: CI

on:
  pull_request:
  push:

jobs:
  checks:
    name: AgentHub checks
    runs-on: ubuntu-24.04
    env:
      # The system Chrome has Ubuntu's AppArmor user-namespace profile.
      # Keep chromiumSandbox enabled; never fall back to --no-sandbox.
      AGENTHUB_VALIDATION_BROWSER_CHANNEL: chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify sandboxed browser for requirement validation
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ channel: process.env.AGENTHUB_VALIDATION_BROWSER_CHANNEL,
            headless: true, chromiumSandbox: true, timeout: 30000 });
          try {
            const page = await browser.newPage();
            await page.setContent('<h1>Browser ready</h1>');
            if (await page.locator('h1').innerText() !== 'Browser ready') throw new Error('Browser probe failed');
            console.log('Sandboxed Chrome ready:', browser.version());
          } finally { await browser.close(); }
          JS

      - name: Install API dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r apps/api/requirements.txt

      - name: Run checks
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Check diff whitespace
        run: git diff --check
